# Release workflow: build once, verify, then publish with PyPI Trusted Publishing (OIDC).
# No API tokens or secrets are used anywhere in this repository.
#
#   * workflow_dispatch  -> publishes to TestPyPI (environment "testpypi"); give the version to expect.
#   * push of a "v*" tag -> publishes to PyPI (environment "pypi"), then creates a GitHub Release
#                           with the dist files attached.
#
# ONE-TIME SETUP (repository owner, before the first release):
#   1. On https://test.pypi.org and on https://pypi.org (separate accounts) open
#      Account settings -> Publishing -> "Add a new pending publisher" and enter
#          PyPI project name : askcert
#          Owner             : loc110504
#          Repository name   : askcert
#          Workflow name     : release.yml
#          Environment name  : testpypi  (on test.pypi.org)  /  pypi  (on pypi.org)
#      The first successful publish turns the pending publisher into a normal one and creates the project.
#   2. On GitHub (Settings -> Environments) create the environments "testpypi" and "pypi". Add
#      "Required reviewers" to "pypi" so a person approves every upload; optionally restrict it to
#      tags matching "v*". (Environment protection rules on a private repository need a paid GitHub plan.)
#   3. Release: bump __version__ in src/askcert/__init__.py and CHANGELOG.md on main, then
#          git tag v0.1.0 && git push origin v0.1.0
#      For a dry run, start this workflow by hand (Actions -> Release -> Run workflow) first.
#
# Notes: the publish action also uploads PEP 740 attestations. If that step fails while the repository
# is still private, set `attestations: false` on the publish step and re-run. A version, once
# uploaded to PyPI, can never be replaced: TestPyPI uses skip-existing so a re-run is harmless.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version expected in the build (must equal askcert.__version__), e.g. 0.1.0"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test the release commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest -m "not slow"

  build:
    name: build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    name: verify version and test-install the wheel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install only the wheel into a fresh venv and check the version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            expected="${REF_NAME#v}"
          else
            expected="${INPUT_VERSION#v}"
          fi
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          actual="$("$RUNNER_TEMP/venv/bin/python" -c 'import askcert; print(askcert.__version__)')"
          echo "expected=$expected askcert.__version__=$actual"
          test "$actual" = "$expected" || { echo "::error::version mismatch: expected '$expected', package says '$actual'"; exit 1; }
          cli="$("$RUNNER_TEMP/venv/bin/askcert" --version)"
          echo "askcert --version -> $cli"
          case "$cli" in *"$expected"*) ;; *) echo "::error::CLI version '$cli' does not contain '$expected'"; exit 1 ;; esac
          cd "$GITHUB_WORKSPACE"
          for f in dist/*; do
            case "$f" in *"-$expected"[-.]*) ;; *) echo "::error::$f does not carry version $expected"; exit 1 ;; esac
          done

  publish-testpypi:
    name: publish to TestPyPI
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [test, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/askcert/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: publish to PyPI
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [test, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/askcert/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=()
          # anything other than plain N.N.N (rc, a, b, dev ...) is a pre-release
          if ! [[ "${TAG#v}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "askcert $TAG" --generate-notes "${flags[@]}"
